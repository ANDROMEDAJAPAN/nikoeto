name: Fetch generated assets

# 生成済みアセット(外部CDN)をリポジトリに取り込むワークフロー。
# このリポジトリのコンテナ環境からは当該CDNへ直接アクセスできないため、
# GitHub Actions ランナー経由でダウンロード・最適化・コミットする。
# .github/asset-sources.json を更新してpushすると実行される。

on:
  push:
    paths:
      - ".github/asset-sources.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download and optimize assets
        run: |
          set -eu
          SRC=.github/asset-sources.json
          mkdir -p assets/img/textures assets/video

          # 画像: JPGへ変換し長辺を制限(maxはJSONのwidthキー、既定1600)
          for name in $(jq -r '(.images // {}) | keys[]' "$SRC"); do
            url=$(jq -r ".images[\"${name}\"].url" "$SRC")
            width=$(jq -r ".images[\"${name}\"].width // 1600" "$SRC")
            curl -fsSL -o "/tmp/${name}.src" "$url"
            ffmpeg -y -loglevel error -i "/tmp/${name}.src" \
              -vf "scale='min(${width},iw)':-2" -q:v 5 \
              "assets/img/textures/${name}.jpg"
          done

          # 動画: 720pへ圧縮(webサイズ)
          for name in $(jq -r '(.videos // {}) | keys[]' "$SRC"); do
            url=$(jq -r ".videos[\"${name}\"]" "$SRC")
            curl -fsSL -o "/tmp/${name}.mp4" "$url"
            ffmpeg -y -loglevel error -i "/tmp/${name}.mp4" \
              -vf "scale=720:-2" -c:v libx264 -preset slow -crf 26 \
              -pix_fmt yuv420p -movflags +faststart -an \
              "assets/video/${name}.mp4"
          done
          ls -la assets/img/textures assets/video || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Add generated assets (optimized for web)"; git push; }
